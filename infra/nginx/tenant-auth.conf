# /etc/nginx/conf.d/tenant-auth.conf
# auth.<domain> of every tenant -> hoandat-auth on 127.0.0.1:4500 (ADR 0006).
# The IdP picks the tenant from the Host header and answers 421 for a
# domain that is not a tenant. auth.hoandat.com keeps its own block, which
# wins over this regex. Needs tenants-http.conf (map, log format).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ~^auth\.(?<tenant>.+)$;

    ssl_certificate     /etc/letsencrypt-tenants/live/$tenant_cert/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-tenants/live/$tenant_cert/privkey.pem;

    access_log /var/log/nginx/tenants.access.log hoandat_tenants;
    error_log  /var/log/nginx/tenants.error.log;

    client_max_body_size 64k;

    # The internal API listens on its own loopback port and is never proxied.
    location /internal {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:4500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
