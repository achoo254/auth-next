# /etc/nginx/conf.d/tenant-auth.conf
# auth.<domain> of every tenant -> hoandat-auth on 127.0.0.1:4500 (ADR 0006).
# The IdP picks the tenant from the Host header and answers 421 for a
# domain that is not a tenant. auth.hoandat.com keeps its own block, which
# wins over this regex. Needs tenants-http.conf (map, log format).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ~^auth\.(?<tenant>.+)$;

    ssl_certificate     /etc/letsencrypt-tenants/live/$tenant_cert/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-tenants/live/$tenant_cert/privkey.pem;

    access_log /var/log/nginx/tenants.access.log hoandat_tenants;
    error_log  /var/log/nginx/tenants.error.log;

    # Client IP: the visitor, as Cloudflare names it (proxied hosts) or as
    # the port-80 hop passes it over loopback (Flexible). Declared here so
    # this block does not depend on another app's http-level real-IP setup;
    # a server-level list replaces the inherited one. Ranges: the same list
    # as src/tenants/cloudflare-ips.ts, IPv4 and IPv6 (a test keeps them equal).
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from  127.0.0.1;
    set_real_ip_from  173.245.48.0/20;
    set_real_ip_from  103.21.244.0/22;
    set_real_ip_from  103.22.200.0/22;
    set_real_ip_from  103.31.4.0/22;
    set_real_ip_from  141.101.64.0/18;
    set_real_ip_from  108.162.192.0/18;
    set_real_ip_from  190.93.240.0/20;
    set_real_ip_from  188.114.96.0/20;
    set_real_ip_from  197.234.240.0/22;
    set_real_ip_from  198.41.128.0/17;
    set_real_ip_from  162.158.0.0/15;
    set_real_ip_from  104.16.0.0/13;
    set_real_ip_from  104.24.0.0/14;
    set_real_ip_from  172.64.0.0/13;
    set_real_ip_from  131.0.72.0/22;
    set_real_ip_from  2400:cb00::/32;
    set_real_ip_from  2606:4700::/32;
    set_real_ip_from  2803:f800::/32;
    set_real_ip_from  2405:b500::/32;
    set_real_ip_from  2405:8100::/32;
    set_real_ip_from  2a06:98c0::/29;
    set_real_ip_from  2c0f:f248::/32;

    client_max_body_size 64k;

    # HTTP-01 also on 443: a proxied host in Full mode with "Always Use
    # HTTPS" turns the challenge into an https request to this block.
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/hoandat-tenant-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # The internal API listens on its own loopback port and is never proxied.
    location /internal {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:4500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
