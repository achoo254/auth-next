# /etc/nginx/conf.d/auth.hoandat.com.conf
# auth.hoandat.com -> hoandat-auth (pm2) on 127.0.0.1:4500.
#
# Cloudflare proxies the hostname (SSL mode "full"), so the origin presents the
# shared self-signed certificate. The Cloudflare real-IP rules already live at
# http level on this host, so $remote_addr is the client address here and is
# the only value forwarded; the IdP trusts X-Forwarded-* from 127.0.0.1 only.

# log_format is only valid at http level; conf.d files are included there.
log_format hoandat_auth '$remote_addr - [$time_local] "$request_method $logged_uri" '
                        '$status $body_bytes_sent "$http_user_agent" $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name auth.hoandat.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auth.hoandat.com;

    ssl_certificate "/etc/pki/nginx/server.crt";
    ssl_certificate_key "/etc/pki/nginx/server.key";

    # Reset links carry their token in the path, so the access log keeps
    # only the route prefix for them.
    set $logged_uri $request_uri;
    if ($request_uri ~ ^/reset/) {
        set $logged_uri /reset/[redacted];
    }
    access_log /var/log/nginx/auth.hoandat.com.access.log hoandat_auth;
    error_log  /var/log/nginx/auth.hoandat.com.error.log;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:4500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
