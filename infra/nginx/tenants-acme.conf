# /etc/nginx/conf.d/tenants-acme.conf
# Port 80 of every tenant host (auth., localman., tunnel. and their
# subdomains, ADR 0006): HTTP-01 challenges from the provisioner's webroot,
# everything else to https. Exact server names (hoandat.com, other apps on
# this machine) always win over this regex block.
server {
    listen 80;
    listen [::]:80;
    server_name ~^(?:[^.]+\.)?(?:auth|localman|tunnel)\.(?<tenant>.+)$;

    access_log /var/log/nginx/tenants.access.log hoandat_tenants;
    error_log  /var/log/nginx/tenants.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/hoandat-tenant-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
