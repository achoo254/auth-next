# /etc/nginx/conf.d/tenants-acme.conf
# Port 80 of every tenant host (auth., chat., localman., tunnel., scribe. and
# their subdomains, ADR 0006 and 0012): HTTP-01 challenges from the
# provisioner's webroot; a visitor's https request that Cloudflare forwards
# here (Flexible SSL) to the host's own 443 block over loopback; everything
# else to https. Exact server names (hoandat.com, other apps on this
# machine) always win over this regex block. Needs tenants-http.conf (geo,
# maps, log format).
server {
    listen 80;
    listen [::]:80;
    server_name ~^(?:[^.]+\.)?(?:auth|chat|localman|tunnel|scribe)\.(?<tenant>.+)$;

    access_log /var/log/nginx/tenants.access.log hoandat_tenants;
    error_log  /var/log/nginx/tenants.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/hoandat-tenant-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        if ($tenant_flexible_https = 0) {
            return 301 https://$host$request_uri;
        }
        # Body size, timeouts and buffering are the 443 block's business.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_http_version 1.1;
        proxy_pass https://127.0.0.1:443;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tenant_connection_upgrade;
    }
}
