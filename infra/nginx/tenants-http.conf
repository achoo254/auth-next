# /etc/nginx/conf.d/00-tenants-http.conf
# http-level pieces shared by every app's tenant server blocks (ADR 0006).
# Shipped by hoandat-auth; the localman and tunelo tenant blocks use them too.

# Certificate of a tenant host, by SNI: subdomains of localman./tunnel. use
# the tenant's wildcard certificate, auth./localman./tunnel. its hosts
# certificate. Files live in the provisioner's config dir and are read at
# handshake, so a newly issued certificate needs no reload. A host with no
# certificate fails the handshake.
map $ssl_server_name $tenant_cert {
    ~^[^.]+\.(?:localman|tunnel)\.(?<d>.+)$    wildcard.$d;
    ~^(?:auth|localman|tunnel)\.(?<d>.+)$      $d;
    default                                    none;
}

# One-time admin links carry their token in the query string: keep only
# the path in access logs.
map $request_uri $tenant_logged_uri {
    ~^/admin/handoff    /admin/handoff?[redacted];
    default             $request_uri;
}

log_format hoandat_tenants '$remote_addr - [$time_local] $host "$request_method $tenant_logged_uri" '
                           '$status $body_bytes_sent "$http_user_agent" $request_time';
