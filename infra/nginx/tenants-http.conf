# /etc/nginx/conf.d/00-tenants-http.conf
# http-level pieces shared by every app's tenant server blocks (ADR 0006).
# Shipped by hoandat-auth; the localman and tunelo tenant blocks use them too.

# Certificate of a tenant host, by SNI: subdomains of localman./tunnel. use
# the tenant's wildcard certificate, auth./chat./localman./tunnel. its hosts
# certificate. Files live in the provisioner's config dir and are read at
# handshake, so a newly issued certificate needs no reload. A host with no
# certificate fails the handshake.
map $ssl_server_name $tenant_cert {
    ~*^[a-z0-9-]+\.(?:localman|tunnel)\.(?<d>[a-z0-9-]+(?:\.[a-z0-9-]+)+)$    wildcard.$d;
    ~*^(?:auth|chat|localman|tunnel)\.(?<d>[a-z0-9-]+(?:\.[a-z0-9-]+)+)$      $d;
    default                                                                     none;
}

# Query strings that carry one-time secrets (admin links, OAuth codes and
# state, device user codes): keep only the path in access logs.
map $request_uri $tenant_logged_uri {
    ~^(?<p>/(?:admin/handoff|oauth/[a-z]+/callback|account/callback|device|auth/callback))\?    $p?[redacted];
    default                                                                                   $request_uri;
}

log_format hoandat_tenants '$remote_addr - [$time_local] $host "$request_method $tenant_logged_uri" '
                           '$status $body_bytes_sent "$http_user_agent" $request_time';

# Cloudflare Flexible SSL (ADR 0006): Cloudflare reaches a proxied tenant
# host on port 80 over plain HTTP, saying in X-Forwarded-Proto what the
# visitor used. Such a request (and only from a Cloudflare address, before
# real-IP rewriting) is passed by tenants-acme.conf to the host's own 443
# block on loopback instead of being redirected back to https, which would
# loop. Ranges: https://www.cloudflare.com/ips-v4 and ips-v6, the same lists as
# src/tenants/cloudflare-ips.ts (a test keeps them equal).
geo $realip_remote_addr $tenant_from_cloudflare {
    default              0;
    173.245.48.0/20      1;
    103.21.244.0/22      1;
    103.22.200.0/22      1;
    103.31.4.0/22        1;
    141.101.64.0/18      1;
    108.162.192.0/18     1;
    190.93.240.0/20      1;
    188.114.96.0/20      1;
    197.234.240.0/22     1;
    198.41.128.0/17      1;
    162.158.0.0/15       1;
    104.16.0.0/13        1;
    104.24.0.0/14        1;
    172.64.0.0/13        1;
    131.0.72.0/22        1;
    2400:cb00::/32       1;
    2606:4700::/32       1;
    2803:f800::/32       1;
    2405:b500::/32       1;
    2405:8100::/32       1;
    2a06:98c0::/29       1;
    2c0f:f248::/32       1;
}

map "$tenant_from_cloudflare:$http_x_forwarded_proto" $tenant_flexible_https {
    "1:https"   1;
    default     0;
}

map $http_upgrade $tenant_connection_upgrade {
    default     upgrade;
    ""          "";
}

# The 443 blocks see a Flexible request coming from loopback with the
# visitor in CF-Connecting-IP. tenant-auth.conf and chat's tenant block
# trust loopback themselves (server level); this http-level line remains
# only for the localman/tunelo tenant blocks, and goes once they do the
# same (ADR 0006).
set_real_ip_from 127.0.0.1;
