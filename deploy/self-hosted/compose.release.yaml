# Released images instead of local builds (ADR 0007): update.sh writes
# release.env with the registry and each image's verified digest, and runs
#   docker compose -f compose.yaml -f compose.release.yaml --env-file .env --env-file release.env ...
# Pulling by digest means the containers run exactly what was verified;
# `build: !reset null` keeps compose from building one locally instead.
services:
  nginx:
    image: ${RELEASE_REGISTRY:?run update.sh}/selfhosted-nginx@${NGINX_DIGEST:?run update.sh}
    pull_policy: missing
    build: !reset null
  auth:
    image: ${RELEASE_REGISTRY}/selfhosted-auth@${AUTH_DIGEST:?run update.sh}
    pull_policy: missing
    build: !reset null
  localman:
    image: ${RELEASE_REGISTRY}/selfhosted-localman@${LOCALMAN_DIGEST:?run update.sh}
    pull_policy: missing
    build: !reset null
  tunelo:
    image: ${RELEASE_REGISTRY}/selfhosted-tunelo@${TUNELO_DIGEST:?run update.sh}
    pull_policy: missing
    build: !reset null
  chat-migrate:
    image: ${RELEASE_REGISTRY}/selfhosted-chat@${CHAT_DIGEST:?run update.sh}
    pull_policy: missing
    build: !reset null
  chat:
    image: ${RELEASE_REGISTRY}/selfhosted-chat@${CHAT_DIGEST}
    pull_policy: missing
    build: !reset null
