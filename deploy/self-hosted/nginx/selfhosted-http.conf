# http-level pieces only the self-hosted bundle needs (ADR 0007); every
# server block comes from the apps' own nginx files (assemble.sh).

# Client IP, as the shared host sets it at http level and Localman's and
# Tunelo's blocks rely on: the visitor named by Cloudflare (proxied hosts),
# or by the port-80 hop over loopback (Flexible, tenants-acme.conf). With
# it, a Flexible request never reaches a block as 127.0.0.1, which only the
# apps in this namespace are (Localman's /internal/, localman-internal.inc).
# 127.0.0.1 itself is trusted by 00-tenants-http.conf. Ranges: the same list
# as src/tenants/cloudflare-ips.ts (a test keeps them equal).
real_ip_header    CF-Connecting-IP;
real_ip_recursive on;
set_real_ip_from  173.245.48.0/20;
set_real_ip_from  103.21.244.0/22;
set_real_ip_from  103.22.200.0/22;
set_real_ip_from  103.31.4.0/22;
set_real_ip_from  141.101.64.0/18;
set_real_ip_from  108.162.192.0/18;
set_real_ip_from  190.93.240.0/20;
set_real_ip_from  188.114.96.0/20;
set_real_ip_from  197.234.240.0/22;
set_real_ip_from  198.41.128.0/17;
set_real_ip_from  162.158.0.0/15;
set_real_ip_from  104.16.0.0/13;
set_real_ip_from  104.24.0.0/14;
set_real_ip_from  172.64.0.0/13;
set_real_ip_from  131.0.72.0/22;
set_real_ip_from  2400:cb00::/32;
set_real_ip_from  2606:4700::/32;
set_real_ip_from  2803:f800::/32;
set_real_ip_from  2405:b500::/32;
set_real_ip_from  2405:8100::/32;
set_real_ip_from  2a06:98c0::/29;
set_real_ip_from  2c0f:f248::/32;

# Tunelo's tenant block upgrades websockets with this map, which on the
# shared host lives in Tunelo's own primary conf.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server_tokens off;
