# A self-hosted install of hoandat-auth, Localman, Tunelo and Chat for one
# domain (ADR 0007, docs/self-hosted-install.md). Every value comes from
# .env and the files init.sh writes under data/; nothing secret is here.
#
# The apps share nginx's network namespace, as they share one host's
# loopback in production: each listens on 127.0.0.1, nginx reaches them
# there, and they trust forwarded client addresses from loopback only.
# Only nginx publishes ports; the databases have none.
name: selfhosted

x-app: &app
  restart: unless-stopped
  network_mode: service:nginx
  depends_on:
    nginx:
      condition: service_started
      restart: true

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: ../images/nginx.Dockerfile
      additional_contexts:
        auth-src: ../..
        localman-src: ${LOCALMAN_SRC:?set LOCALMAN_SRC in .env}
        chat-src: ${CHAT_SRC:?set CHAT_SRC in .env}
        localman-app: service:localman
        chat-app: service:chat
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Tunelo's TCP tunnels.
      - "${TCP_PORT_RANGE:-10000-10099}:${TCP_PORT_RANGE:-10000-10099}"
    # The apps call each other's public names (OIDC discovery, audit
    # delivery): straight to this nginx, with the real certificate.
    extra_hosts:
      - "auth.${DOMAIN:?set DOMAIN in .env}:127.0.0.1"
      - "chat.${DOMAIN}:127.0.0.1"
      - "localman.${DOMAIN}:127.0.0.1"
      - "tunnel.${DOMAIN}:127.0.0.1"
    volumes:
      - certificates:/etc/letsencrypt-tenants:ro

  certbot:
    image: certbot/dns-cloudflare:v2.11.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/run/certbot/run.sh"]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./certbot/run.sh:/run/certbot/run.sh:ro
      - ./data/secrets/cloudflare.ini:/run/secrets/cloudflare.ini:ro
      - certificates:/etc/letsencrypt

  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      # Initiates the one-node replica set on first start (Localman needs
      # transactions), then reports its status.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    volumes:
      - mongo-data:/data/db

  postgres:
    # The official image ships contrib: chat's migrations create pg_trgm.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "chat", "-d", "chat"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - ./data/secrets/postgres-password:/run/secrets/postgres-password:ro
      - postgres-data:/var/lib/postgresql/data

  auth:
    <<: *app
    build:
      context: ../..
    # The operator's user: the signing and enrollment keys stay mode 600.
    # Writable only so the IdP can mark its enrollment done there.
    user: "${PUID:?run init.sh}:${PGID:?run init.sh}"
    env_file: ./data/env/auth.env
    volumes:
      - ./data/secrets/auth:/run/secrets/hoandat-auth
    depends_on:
      nginx:
        condition: service_started
        restart: true
      mongo:
        condition: service_healthy

  localman:
    <<: *app
    build:
      context: ${LOCALMAN_SRC}
      dockerfile: ${SELFHOSTED_DIR:?run init.sh}/images/localman.Dockerfile
    env_file: ./data/env/localman.env
    depends_on:
      nginx:
        condition: service_started
        restart: true
      mongo:
        condition: service_healthy

  tunelo:
    <<: *app
    build:
      context: ${LOCALMAN_SRC}
      dockerfile: ${SELFHOSTED_DIR:?run init.sh}/images/tunelo.Dockerfile
    env_file: ./data/env/tunelo.env
    depends_on:
      nginx:
        condition: service_started
        restart: true
      mongo:
        condition: service_healthy

  chat-migrate:
    image: selfhosted-chat
    build: &chat-build
      context: ${CHAT_SRC}
      dockerfile: ${SELFHOSTED_DIR}/images/chat.Dockerfile
    command: ["-role", "migrate"]
    env_file: ./data/env/chat.env
    depends_on:
      postgres:
        condition: service_healthy

  chat:
    <<: *app
    image: selfhosted-chat
    build: *chat-build
    env_file: ./data/env/chat.env
    depends_on:
      nginx:
        condition: service_started
        restart: true
      chat-migrate:
        condition: service_completed_successfully

volumes:
  certificates:
  mongo-data:
  postgres-data:
