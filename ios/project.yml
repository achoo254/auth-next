# XcodeGen spec of AccountApp.xcodeproj. The generated project is committed,
# so building needs only Xcode; after changing this file run `xcodegen`
# in ios/ and commit both.
name: AccountApp
options:
  bundleIdPrefix: com.hoandat
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
packages:
  AccountKit:
    path: AccountKit
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  AccountApp:
    type: application
    platform: iOS
    sources:
      - path: AccountApp
    dependencies:
      - package: AccountKit
    settings:
      base:
        INFOPLIST_FILE: AccountApp/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ENABLE_PREVIEWS: YES
  AccountAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AccountAppUITests
    dependencies:
      - target: AccountApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.hoandat.account.uitests
        TEST_TARGET_NAME: AccountApp
        CODE_SIGN_ENTITLEMENTS: ""
schemes:
  AccountApp:
    build:
      targets:
        AccountApp: all
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - package: AccountKit/AccountKitTests
        - name: AccountAppUITests
    run:
      config: Debug
    archive:
      config: Release
