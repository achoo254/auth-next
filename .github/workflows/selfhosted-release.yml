# Release of the self-hosted bundle (ADR 0007, docs/self-hosted-install.md):
# six images, the same for every domain, pushed to GHCR (public) and
# signed keyless by this workflow, which update.sh checks
# on every install. Run by hand with the release version and the commits of
# localman-next and chat-next it ships (public repositories, read with the
# workflow's own token). A package GHCR creates on the first push may be
# private: make each selfhosted-* package public once, in its settings.
name: selfhosted-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (x.y.z)
        required: true
      localman_ref:
        description: Full commit SHA (40 characters) or tag of localman-next
        required: true
      chat_ref:
        description: Full commit SHA (40 characters) or tag of chat-next
        required: true

permissions:
  contents: read
  packages: write
  # Keyless signing: the workflow's OIDC identity is the signature.
  id-token: write

concurrency:
  group: selfhosted-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  VERSION: ${{ inputs.version }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check the inputs
        env:
          LOCALMAN_REF: ${{ inputs.localman_ref }}
          CHAT_REF: ${{ inputs.chat_ref }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be x.y.z"; exit 1; }
          # actions/checkout takes a short SHA for a branch name.
          for ref in "$LOCALMAN_REF" "$CHAT_REF"; do
            if [[ "$ref" =~ ^[0-9a-f]{7,39}$ ]]; then
              echo "use the full 40-character commit SHA, not $ref"; exit 1
            fi
          done

      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/localman-next
          ref: ${{ inputs.localman_ref }}
          path: sources/localman-next

      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/chat-next
          ref: ${{ inputs.chat_ref }}
          path: sources/chat-next

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: auth
        id: auth
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/selfhosted-auth:${{ env.VERSION }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: localman
        id: localman
        uses: docker/build-push-action@v6
        with:
          context: sources/localman-next
          file: deploy/self-hosted/images/localman.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/selfhosted-localman:${{ env.VERSION }}
          labels: org.opencontainers.image.revision=${{ inputs.localman_ref }}

      - name: tunelo
        id: tunelo
        uses: docker/build-push-action@v6
        with:
          context: sources/localman-next
          file: deploy/self-hosted/images/tunelo.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/selfhosted-tunelo:${{ env.VERSION }}
          labels: org.opencontainers.image.revision=${{ inputs.localman_ref }}

      - name: chat
        id: chat
        uses: docker/build-push-action@v6
        with:
          context: sources/chat-next
          file: deploy/self-hosted/images/chat.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/selfhosted-chat:${{ env.VERSION }}
          labels: org.opencontainers.image.revision=${{ inputs.chat_ref }}

      - name: nginx
        id: nginx
        uses: docker/build-push-action@v6
        with:
          context: deploy/self-hosted/nginx
          file: deploy/self-hosted/images/nginx.Dockerfile
          platforms: linux/amd64
          push: true
          build-contexts: |
            auth-src=.
            localman-src=sources/localman-next
            chat-src=sources/chat-next
            localman-app=docker-image://${{ env.REGISTRY }}/selfhosted-localman@${{ steps.localman.outputs.digest }}
            chat-app=docker-image://${{ env.REGISTRY }}/selfhosted-chat@${{ steps.chat.outputs.digest }}
          tags: ${{ env.REGISTRY }}/selfhosted-nginx:${{ env.VERSION }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: bundle
        id: bundle
        uses: docker/build-push-action@v6
        with:
          context: deploy/self-hosted
          file: deploy/self-hosted/images/bundle.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/selfhosted-bundle:${{ env.VERSION }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Sign every image by digest
        env:
          DIGESTS: >-
            auth=${{ steps.auth.outputs.digest }}
            localman=${{ steps.localman.outputs.digest }}
            tunelo=${{ steps.tunelo.outputs.digest }}
            chat=${{ steps.chat.outputs.digest }}
            nginx=${{ steps.nginx.outputs.digest }}
            bundle=${{ steps.bundle.outputs.digest }}
        run: |
          for pair in $DIGESTS; do
            image="${pair%%=*}"; digest="${pair#*=}"
            cosign sign --yes "$REGISTRY/selfhosted-$image@$digest"
          done
